[workspace]
members = [
  "bindings/python",
  "crates/catalog/*",
  "crates/examples",
  "crates/iceberg",
  "crates/integration_tests",
  "crates/integrations/*",
  "crates/property-macro",
  "crates/sqllogictest",
  "crates/storage/*",
  "crates/test_utils",
]
resolver = "2"

[workspace.package]
edition = "2024"
homepage = "https://rust.iceberg.apache.org/"
publish = false
version = "0.11.0"

license = "Apache-2.0"
repository = "https://github.com/apache/iceberg-rust"
# Check the MSRV policy in README.md before changing this
rust-version = "1.95"

[workspace.lints.rust]
unused_qualifications = "deny"

[workspace.dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = "0.10"
anyhow = "1.0.72"
apache-avro = { version = "0.21", features = ["snappy", "zstandard"] }
array-init = "2"
arrow = "59"
arrow-arith = "59"
arrow-array = "59"
arrow-buffer = "59"
arrow-cast = "59"
arrow-ord = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-string = "59"
as-any = "0.3.2"
async-trait = "0.1.89"
aws-config = "1.8.7"
aws-credential-types = "1.2"
aws-sdk-glue = { version = "1.85", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3tables = { version = "1.28", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-sts = "1.63"
aws-sigv4 = { version = "1.2", features = ["sign-http"] }
backon = "1.5.1"
base64 = "0.22.1"
bimap = "0.6"
bytes = "1.11"
