iceberg = { version = "0.11.0", path = "./crates/iceberg" }
iceberg-catalog-glue = { version = "0.11.0", path = "./crates/catalog/glue" }
iceberg-catalog-hms = { version = "0.11.0", path = "./crates/catalog/hms" }
